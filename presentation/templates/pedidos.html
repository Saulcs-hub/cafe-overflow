<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Café Overflow</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-pagina="pedidos">
  <aside class="lateral">
    <a class="marca" href="/">
      <svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 18h24v12a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10z"/>
        <path d="M34 21h3a4 4 0 0 1 0 8h-3"/>
        <path d="M18 5c-2 2 2 4 0 7M26 5c-2 2 2 4 0 7"/>
        <path d="M19 25l-3 3 3 3M25 25l3 3-3 3"/>
      </svg>
      <strong>Café Overflow</strong>
      <small>Dev &amp; Coffee Lounge</small>
    </a>
    <nav>
      <a href="/">Inicio</a>
      <a href="/menu.html">Menú</a>
      <a class="activo" href="/pedidos.html">Pedidos</a>
      <a href="/clientes.html">Clientes</a>
    </nav>
  </aside>

  <main class="contenido">
    <h1>Pedidos</h1>
    <p class="subtitulo">Consulta y gestiona los pedidos.</p>

    <div id="filtros" class="filtros">
      <button class="activo" data-estado="">Todos</button>
      <button data-estado="Pendiente de pago">Pendiente de pago</button>
      <button data-estado="En preparación">En preparación</button>
      <button data-estado="Listo">Listo</button>
      <button data-estado="Entregado">Entregado</button>
    </div>

    <section class="panel">
      <input class="buscador" type="search" id="buscar-pedido" placeholder="Buscar por cliente o producto...">
      <div class="tabla-contenedor">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Productos</th>
              <th>Total</th>
              <th>Estado</th>
              <th>Fecha</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tabla-pedidos"></tbody>
        </table>
      </div>
      <div id="mensaje-pedidos" class="mensaje"></div>
    </section>
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
